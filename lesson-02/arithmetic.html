<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E3C9E">
  <meta name="description" content="整数の加減算と表現範囲、桁上がり・借り、オーバーフローをビット列で確認する教材。">
  <title>加減算とオーバーフロー | プログラミングA</title>
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="./arithmetic.css">
  <script defer src="./bits-model.js"></script>
  <script defer src="./arithmetic.js"></script>
</head>
<body>
  <a class="skip-link" href="#arithmetic-lesson">教材へ移動</a>
  <header class="site-header wrap"><a class="brand" href="../index.html"><span class="brand-mark">A<span>_</span></span><span>プログラミングA</span></a><button class="reset-button" id="arithmetic-reset" type="button">↺ 初期化</button></header>
  <main class="wrap">
    <nav class="breadcrumbs" aria-label="現在地"><ol><li><a href="../index.html">講義一覧</a></li><li><a href="./index.html">第2回</a></li><li><span aria-current="page">加減算とオーバーフロー</span></li></ol></nav>
    <section class="arithmetic-intro"><h1>加減算とオーバーフロー</h1></section>
    <div class="arithmetic-layout" id="arithmetic-lesson">
      <section class="arithmetic-panel" aria-labelledby="calculation-title">
        <div class="arithmetic-heading"><h2 id="calculation-title"><span>01</span> 型と計算</h2></div>
        <form id="calculation-form" class="calculation-form" novalidate>
          <label class="control-label" for="calculation-type">C言語の整数型</label>
          <select id="calculation-type" aria-describedby="type-detail"></select>
          <p id="type-detail" class="type-detail">32 ビット · 符号なし</p>
          <div class="operand-field"><label class="control-label" for="operand-a">A <span>10進数</span></label><input id="operand-a" type="text" inputmode="text" value="4294967295" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" aria-describedby="error-a number-range"><p class="field-error" id="error-a" role="status"></p></div>
          <div class="operation-row"><div><label class="control-label" for="operator">演算</label><select id="operator"><option value="+">＋</option><option value="-">−</option></select></div><div class="operand-field"><label class="control-label" for="operand-b">B <span>10進数</span></label><input id="operand-b" type="text" inputmode="text" value="1" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" aria-describedby="error-b number-range"><p class="field-error" id="error-b" role="status"></p></div></div>
          <button class="calculate-button" type="submit">計算</button>
          <div class="boundary-examples"><h3>境界の例</h3><div><button id="example-max" type="button">最大値 ＋ 1</button><button id="example-min" type="button">最小値 − 1</button></div></div>
          <section class="number-range" id="number-range" aria-labelledby="range-title"><h3 id="range-title">この型で表せる範囲</h3><dl><div><dt>最小値</dt><dd id="range-min">0</dd></div><div><dt>最大値</dt><dd id="range-max">4294967295</dd></div></dl></section>
          <p class="promotion-note" id="promotion-note">A・Bをどちらも unsigned int として計算します。</p>
        </form>
      </section>
      <section class="arithmetic-panel result-panel" aria-labelledby="result-title">
        <div class="arithmetic-heading"><h2 id="result-title"><span>02</span> A・B・結果のビット列</h2><span id="result-width">32 ビット</span></div>
        <div class="result-body"><p class="result-empty" id="result-empty" role="status">未計算</p>
          <div id="result-content" hidden>
            <p class="result-status" id="result-status" role="status"></p>
            <p class="result-expression" id="result-expression"></p>
            <div class="result-values"><div><span>数学上の結果</span><output id="exact-value"></output></div><div><span id="stored-value-label">この型での計算結果</span><output id="stored-value"></output></div></div>
            <div class="carry-strip"><div><span id="carry-label">最上位の外への桁上がり</span><strong id="carry-value">0</strong></div><p id="carry-description"></p></div>
            <h3 class="bits-title" id="result-bits-title">A・B・結果のビット列</h3>
            <div class="result-bits" id="result-bits" role="img" aria-label="A・B・結果のビット列"></div>
            <p class="result-explanation" id="result-explanation"></p>
          </div>
        </div>
      </section>
    </div>
    <nav class="topic-navigation" aria-label="題材の移動"><a class="topic-prev" href="./bits.html"><span>前の題材</span><strong>整数型とビット列</strong></a><a class="topic-overview" href="./index.html"><span>題材一覧</span><strong>第2回</strong></a></nav>
    <footer class="site-footer"><span>プログラミングA · 第2回</span></footer>
  </main>
</body>
</html>
